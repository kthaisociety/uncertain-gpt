name: paper

# Builds paper/main.pdf and commits it back, so GitHub's in-browser PDF
# viewer can render it straight from the repo.
#
# There is deliberately no `pull_request` trigger: this workflow needs
# `contents: write`, and a fork PR must never get that. Pushes to the
# default branch can only come from someone who already has write access.
on:
  push:
    branches: [main]
    paths:
      - 'paper/**'
      - '.github/workflows/paper.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-pdf
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-bibtex-extra lmodern latexmk

      # `runs/` is gitignored and absent here, so the generators have nothing
      # to measure and keep the committed fragments in paper/tables/generated/
      # instead of overwriting them with placeholders. The PDF built here
      # therefore carries the numbers of whichever run last regenerated them;
      # each fragment states that run's commit and day. See paper/README.md.
      #
      # The Makefile owns the build command; this only calls it. A fixed
      # SOURCE_DATE_EPOCH strips the build timestamp out of the PDF so an
      # unchanged source produces a byte-identical file and the commit below
      # is skipped.
      - name: Build
        env:
          SOURCE_DATE_EPOCH: '0'
          FORCE_SOURCE_DATE: '1'
        run: make -C paper

      - name: Commit PDF if it changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper/main.pdf
          if git diff --cached --quiet -- paper/main.pdf; then
            echo 'paper/main.pdf is byte-unchanged; nothing to commit.'
            exit 0
          fi
          git commit -m 'paper: rebuild main.pdf from ${{ github.sha }}'
          git push origin HEAD:${{ github.ref_name }}
