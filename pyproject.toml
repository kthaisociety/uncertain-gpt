[build-system]
# torch is deliberately NOT listed here. setup.py imports the torch that is
# already installed, so the package must be built with --no-build-isolation;
# declaring torch as a build requirement would pull a second copy into an
# isolated environment and link the extension against the wrong one.
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uncertain"
version = "0.1.0"
description = "A GPT-2 whose weights are distributions — the C/CUDA trainer, importable from Python"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = ["torch>=2.0", "numpy"]

[project.urls]
Source = "https://github.com/tagesk-tech/uncertain-gpt"

[tool.setuptools]
packages = ["uncertain"]

[tool.setuptools.package-data]
uncertain = ["*.cu"]
